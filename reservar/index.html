<style>
:root{
  --brand:#2563eb;
  --b2:color-mix(in srgb,var(--brand) 50%,#06b6d4);
  --grad:linear-gradient(135deg,var(--brand),var(--b2));
  --bg:#f4f7fc;--ink:#0f172a;--mut:#5f6b80;--card:rgba(255,255,255,.74);--card2:rgba(255,255,255,.9);
  --line:rgba(15,23,42,.1);--inp:rgba(255,255,255,.9);--sh:0 18px 50px -18px rgba(20,50,110,.35);
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--r:22px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--disp:'Fraunces',Georgia,serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#070d1a;--ink:#eef3fc;--mut:#98a5bc;--card:rgba(18,28,48,.66);--card2:rgba(24,36,60,.9);
  --line:rgba(255,255,255,.1);--inp:rgba(10,18,34,.8);--sh:0 18px 50px -18px #000;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;overflow-x:hidden;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.12}
.disp{font-family:var(--disp);font-weight:700;letter-spacing:-.02em}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}

/* fondo animado */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;animation:float 22s ease-in-out infinite}
.blobs i:nth-child(1){width:46vmax;height:46vmax;background:var(--brand);left:-12vmax;top:-14vmax}
.blobs i:nth-child(2){width:38vmax;height:38vmax;background:var(--b2);right:-10vmax;top:18vh;animation-delay:-7s}
.blobs i:nth-child(3){width:32vmax;height:32vmax;background:color-mix(in srgb,var(--brand) 40%,#6366f1);left:30vw;bottom:-18vmax;animation-delay:-14s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(6vmax,4vmax) scale(1.1)}66%{transform:translate(-4vmax,7vmax) scale(.95)}}

/* tarjetas, botones, campos */
.card{background:var(--card);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:22px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card2);padding:12px 18px;border-radius:14px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s;user-select:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px -10px rgba(0,0,0,.35)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);color:#fff;border:0;box-shadow:0 10px 26px -10px var(--brand)}
.btn.pri:hover{filter:brightness(1.07);box-shadow:0 14px 30px -10px var(--brand)}
.btn.sm{padding:8px 12px;border-radius:11px;font-size:.86rem}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
a.btn{text-decoration:none;color:var(--ink)}
/* pulsación larga en Entrar: barra que se llena + brillo */
#goIn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.38));transform:scaleX(0);transform-origin:left;pointer-events:none;border-radius:inherit}
#goIn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#fff;transform:scaleX(0);transform-origin:left;pointer-events:none;box-shadow:0 0 10px #fff}
#goIn.lp::before,#goIn.lp::after{animation:lpfill 3s linear forwards}
#goIn.lp{animation:lpglow 3s ease-in forwards}
#goIn.lpok{animation:lpok .45s ease-out}
.isheet{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:12px;pointer-events:none}
.isheet>div{pointer-events:auto;width:100%;max-width:460px;background:var(--card2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 -10px 50px -12px rgba(0,0,0,.5);animation:isUp .45s cubic-bezier(.2,.9,.3,1.2)}
.isheet.out>div{animation:isDown .3s ease-in forwards}
.isheet .ih{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.isheet .ilogo{width:52px;height:52px;border-radius:15px;background:var(--grad) center/cover;color:#fff;display:grid;place-items:center;font:700 1.4rem var(--disp);flex:none;box-shadow:0 8px 20px -8px var(--brand)}
.isheet .ix{margin-left:auto;align-self:flex-start;background:none;border:0;color:var(--mut);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px}
.isheet ol{margin:8px 0 14px;padding-left:22px;line-height:1.8;font-size:.95rem}
.isheet .shr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:color-mix(in srgb,var(--brand) 18%,transparent);color:var(--brand);vertical-align:-5px}
.isheet .arrow{text-align:center;font-size:26px;color:var(--brand);animation:bob 1.2s ease-in-out infinite;margin-top:-4px}
@keyframes isUp{from{transform:translateY(110%);opacity:0}to{transform:none;opacity:1}}
@keyframes isDown{to{transform:translateY(110%);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes lpfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lpglow{0%{box-shadow:0 10px 26px -10px var(--brand)}100%{box-shadow:0 0 0 4px rgba(255,255,255,.18),0 0 34px 2px var(--brand);transform:scale(1.02)}}
@keyframes lpok{0%{transform:scale(1.04)}100%{transform:scale(1)}}
a.btn.pri{color:#fff}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--inp);outline:none;transition:border .2s,box-shadow .2s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%,transparent)}
label.f{display:block;font-size:.8rem;font-weight:700;color:var(--mut);margin:14px 0 6px}
textarea.inp{resize:vertical;min-height:80px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}
.small{font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:.9rem;cursor:pointer;transition:.2s}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px var(--brand)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:800;background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand)}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.badge.gray{background:var(--line);color:var(--mut)}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}

/* revelado */
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.skel{border-radius:14px;background:linear-gradient(90deg,var(--line),color-mix(in srgb,var(--line) 40%,transparent),var(--line));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.center{min-height:60vh;display:grid;place-items:center;text-align:center;padding:24px}

/* toast + modal */
#toasts{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;box-shadow:var(--sh);animation:tin .35s cubic-bezier(.2,.8,.2,1)}
.toast.err{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}}
.mask{position:fixed;inset:0;z-index:80;background:rgba(10,5,20,.5);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,100%);max-height:92dvh;overflow:auto;background:var(--card2);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:24px;animation:pop .35s cubic-bezier(.2,.9,.25,1.1)}
.wk{padding:0 10px;font-size:1rem;white-space:nowrap}
.ipk{position:relative;display:flex;align-items:center;gap:14px;padding:12px;border:1.5px dashed var(--line);border-radius:18px;background:var(--inp);cursor:pointer;transition:border-color .2s,background .2s;min-height:96px}
.ipk:hover,.ipk.drag{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,var(--inp))}
.ipk .pv{flex:none;width:72px;height:72px;border-radius:16px;background:color-mix(in srgb,var(--brand) 14%,transparent) center/cover no-repeat;display:grid;place-items:center;color:var(--brand)}
.ipk[data-t=portada] .pv{width:120px}
.ipk .pv svg{width:26px;height:26px}
.ipk .tx{flex:1;min-width:0;font-size:.88rem}.ipk .tx b{display:block;font-size:.95rem}
.ipk .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer;display:grid;place-items:center}
.ipk .x:hover{color:var(--bad)}
.ipk.up .pv::after{content:"";width:26px;height:26px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
.ipk.up .pv{background-color:rgba(0,0,0,.35);background-blend-mode:darken}
.ipk.up .pv svg{display:none}
.ipk input[type=file]{display:none}
.npw{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--card2);margin-bottom:14px}
.npb{display:flex;gap:6px}
.npb button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--ink);font-weight:800;cursor:pointer;transition:transform .15s}
.npb button:hover{transform:translateY(-1px)}
.npb button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px var(--brand)}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ptabs .chip.ok:not(.on){border-color:color-mix(in srgb,var(--ok) 60%,transparent);color:var(--ok)}
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.plans{grid-template-columns:repeat(2,1fr)}}
.plan{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:22px 8px 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s}
.plan:hover{transform:translateY(-2px)}
.plan.on{border-color:var(--brand);box-shadow:0 12px 30px -14px var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--card2))}
.plan .pn{font-size:.95rem}.plan .pp{font:700 1.6rem var(--disp);margin:2px 0}
.plan .tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.68rem;font-weight:800;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--ok) 20%,var(--card2));color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.plan .tag.top{top:auto;bottom:-10px;background:var(--grad);color:#fff;border:0}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
/* ventanas de confirmación */
.cfm{position:fixed;inset:0;z-index:95;background:rgba(5,10,25,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;animation:fade .2s}
.cfm.out{animation:fadeOut .2s forwards}
.cfm .box{width:min(400px,100%);background:var(--card2);border:1px solid var(--line);border-radius:26px;padding:26px 22px 20px;text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:cfPop .38s cubic-bezier(.2,1.1,.3,1.15)}
.cfm.out .box{animation:cfOut .2s forwards}
.cfm .ico{width:62px;height:62px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand);position:relative}
.cfm .ico svg{width:30px;height:30px}
.cfm .ico::after{content:"";position:absolute;inset:-6px;border-radius:24px;border:2px solid currentColor;opacity:.25;animation:cfRing 1.6s ease-out infinite}
.cfm.danger .ico{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.cfm h3{font-family:var(--disp);font-size:1.35rem;margin:0 0 6px}
.cfm p{color:var(--mut);margin:0 0 20px;font-size:.95rem;line-height:1.45}
.cfm .bt{display:flex;gap:10px}.cfm .bt .btn{flex:1}
.cfm.danger .btn.pri{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 10px 26px -10px #dc2626}
@keyframes cfPop{from{opacity:0;transform:scale(.85) translateY(14px)}}
@keyframes cfOut{to{opacity:0;transform:scale(.92)}}
@keyframes cfRing{0%{transform:scale(.9);opacity:.35}100%{transform:scale(1.25);opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@media(max-width:640px){.mask{align-items:end;padding:0}.modal{border-radius:26px 26px 0 0;max-height:94dvh}}
.modal h2{font-size:1.4rem;margin-bottom:4px}

/* ====== LANDING / LOGIN ====== */
.land{max-width:1160px;margin:0 auto;padding:clamp(18px,4vw,48px);display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,64px);align-items:center;min-height:100dvh}
.land h1{font-size:clamp(2.3rem,5.4vw,4.1rem)}
.land h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.land .lead{font-size:1.1rem;color:var(--mut);margin:18px 0 26px;max-width:34em}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
.feat{padding:16px;border-radius:18px}
.feat b{display:block;margin:8px 0 2px}
.feat .ico{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;margin-bottom:28px}
.logo .ico{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center}
.tabs{display:flex;background:var(--line);border-radius:14px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;font-weight:700;cursor:pointer;color:var(--mut);transition:.2s}
.tabs button.on{background:var(--card2);color:var(--ink);box-shadow:0 4px 14px -6px rgba(0,0,0,.3)}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:700;cursor:pointer;padding:6px 0}
.eye{position:relative}.eye button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--mut);padding:8px;font-weight:700;font-size:.8rem}
@media(max-width:900px){.land{grid-template-columns:1fr;min-height:0;gap:26px}.feats{grid-template-columns:1fr}}

/* ====== RESERVA (público) ====== */
.bk{max-width:1120px;margin:0 auto;padding:clamp(12px,3vw,34px);display:grid;grid-template-columns:380px 1fr;gap:26px;align-items:start}
.bk-hero{position:sticky;top:20px;overflow:hidden}
.cover{height:170px;background:var(--grad) center/cover;position:relative}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.35))}
.avatar{width:84px;height:84px;border-radius:24px;border:4px solid var(--card2);background:var(--grad) center/cover;display:grid;place-items:center;color:#fff;font:700 2rem var(--disp);margin:-44px 0 0 22px;position:relative;z-index:2;box-shadow:var(--sh)}
.bk-hero .info{padding:12px 22px 22px}
.bk-hero h1{font-size:1.9rem;margin-top:8px}
.meta{display:flex;gap:9px;align-items:flex-start;margin-top:10px;color:var(--mut);font-size:.93rem}
.meta a{color:inherit}
.sumbox{margin-top:18px;border:1px dashed var(--line);border-radius:16px;padding:14px;font-size:.92rem;display:none}
.sumbox.on{display:block;animation:fade .4s}
.sumbox .tot{display:flex;justify-content:space-between;font-weight:800;margin-top:8px;font-size:1.05rem}
.bk-main{min-width:0}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0 22px}
.prog i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 14px var(--brand)}
.steph{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.steph h2{font-size:1.6rem}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;cursor:pointer;flex:none}
.stepbody{animation:slide .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{opacity:0;transform:translateX(26px)}}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.svc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card2);cursor:pointer;margin-bottom:10px;transition:transform .25s,box-shadow .25s,border-color .25s;position:relative;overflow:hidden}
.svc:hover{transform:translateY(-3px);box-shadow:0 16px 30px -16px var(--brand);border-color:color-mix(in srgb,var(--brand) 55%,var(--line))}
.svc.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.svc .nm{font-weight:700}
.svc .pr{font:700 1.2rem var(--disp);white-space:nowrap}
.pro{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card2);cursor:pointer;margin-bottom:10px;width:100%;text-align:left;transition:.25s}
.pro:hover{transform:translateY(-3px);border-color:var(--brand)}
.pro.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.pro .av{width:48px;height:48px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.15rem;flex:none}
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:22px}
.cal .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal .head b{font-size:1.1rem}
.cal{min-width:0}
.cal .dow,.cal .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.day{min-width:0}
.cal .dow span{font-size:.72rem;font-weight:800;color:var(--mut);padding:6px 0;text-transform:uppercase}
.day{aspect-ratio:1;border-radius:14px;border:1px solid transparent;background:var(--card2);cursor:pointer;font-weight:700;display:grid;place-items:center;transition:.2s;position:relative}
.day:hover:not([disabled]){border-color:var(--brand);transform:scale(1.06)}
.day[disabled]{opacity:.28;background:transparent;cursor:default}
.day.today::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--brand)}
.day.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px var(--brand)}
.day.vac{visibility:hidden}
.slots h4{margin:2px 0 8px;font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-bottom:14px}
.slot{padding:11px 0;text-align:center;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:700;cursor:pointer;transition:.2s}
.slot:hover{border-color:var(--brand);transform:translateY(-2px)}
.slot.on{background:var(--grad);color:#fff;border:0}
.okwrap{text-align:center;padding:10px 0}
.okc{width:92px;height:92px;margin:0 auto 14px}
.okc circle{stroke:var(--ok);stroke-width:4;fill:none;stroke-dasharray:260;stroke-dashoffset:260;animation:dr .7s .1s forwards}
.okc path{stroke:var(--ok);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s .65s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.ticket{border:1px dashed var(--line);border-radius:18px;padding:16px;text-align:left;margin:18px auto;max-width:420px;background:var(--card2)}
.ticket .l{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.ticket .l:last-child{border:0}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:16px;background:color-mix(in srgb,var(--brand) 12%,transparent);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);margin-bottom:16px;flex-wrap:wrap}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95}
.foot{text-align:center;color:var(--mut);font-size:.82rem;padding:26px 0 40px}
.foot a{color:inherit}
@media(max-width:900px){
  .bk{grid-template-columns:1fr;gap:16px}
  .bk-hero{position:static}
  .cover{height:120px}
  .calwrap{grid-template-columns:1fr}
}

/* ====== PANEL ====== */
.app{display:grid;grid-template-columns:262px 1fr;min-height:100dvh;max-width:1400px;margin:0 auto}
.side{position:sticky;top:0;height:100dvh;padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.side .biz{display:flex;gap:12px;align-items:center;padding:8px 10px 16px}
.side .biz .av{width:46px;height:46px;border-radius:15px;background:var(--grad) center/cover;color:#fff;display:grid;place-items:center;font:700 1.2rem var(--disp);flex:none}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:0;background:transparent;font-weight:700;cursor:pointer;color:var(--mut);width:100%;text-align:left;transition:.2s}
.nav:hover{background:var(--line);color:var(--ink)}
.nav.on{background:var(--grad);color:#fff;box-shadow:0 10px 22px -10px var(--brand)}
.main{padding:clamp(14px,3vw,34px);min-width:0;padding-bottom:110px}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ptitle h1{font-size:clamp(1.7rem,3vw,2.4rem)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{padding:16px 18px}
.stat b{display:block;font:700 1.9rem var(--disp)}
.stat span{color:var(--mut);font-size:.82rem;font-weight:600}
.cita{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;margin-bottom:10px;transition:.25s}
.cita:hover{transform:translateY(-2px)}
.cita .t{font:700 1.35rem var(--disp);text-align:center;line-height:1}
.cita .t small{display:block;font:600 .7rem var(--font);color:var(--mut);margin-top:4px}
.cita.x{opacity:.5}.cita.x .who{text-decoration:line-through}
.cita .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dayh{margin:20px 0 10px;font-weight:800;text-transform:capitalize;color:var(--mut)}
.empty{text-align:center;padding:48px 20px;color:var(--mut)}
.empty>svg{width:76px;height:76px;opacity:.55;margin-bottom:10px}
.list>div.it{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;margin-bottom:8px}
.cathead{font-weight:800;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;font-size:.78rem;letter-spacing:.07em}
.hrow{display:grid;grid-template-columns:90px 26px repeat(4,minmax(0,1fr));gap:6px;align-items:center;margin-bottom:8px}
.hrow input[type=time]{padding:9px 6px;font-size:.85rem}
.sw{width:22px;height:22px;accent-color:var(--brand)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.swatches i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.2s}
.swatches i.on,.swatches i:hover{border-color:var(--ink);transform:scale(1.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ring{width:150px;height:150px;position:relative;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:700 2.2rem var(--disp)}
.ring .n small{display:block;font:600 .75rem var(--font);color:var(--mut)}
.qrbox{background:#fff;padding:14px;border-radius:18px;display:inline-block}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:middle}
.tbl th{font-size:.74rem;text-transform:uppercase;color:var(--mut);letter-spacing:.06em}
.botnav{display:none}

.wafab:hover{transform:translateY(-3px) scale(1.03)}
.wafab span{display:none}
.wafab::after{content:"";position:absolute;inset:0;border-radius:99px;border:2px solid #25d366;animation:waRing 2.4s infinite}
@media (min-width:640px){.wafab span{display:inline}.wafab{padding:12px 18px}}
@keyframes waIn{from{opacity:0;transform:scale(.4)}}
@keyframes waRing{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.35);opacity:0}}
.mtop{display:none}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mtop{display:flex;align-items:center;gap:10px;margin:-4px 0 16px}
  .mtop .av{width:38px;height:38px;border-radius:12px;background:var(--grad) center/cover;color:#fff;display:grid;place-items:center;font:700 1rem var(--disp);flex:none}

  .botnav{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:70;padding:6px;gap:2px;border-radius:22px;justify-content:space-between}
  .botnav button{flex:1;display:grid;justify-items:center;gap:2px;padding:8px 2px;border:0;background:transparent;border-radius:16px;color:var(--mut);font-size:.66rem;font-weight:700;cursor:pointer}

  .stats{grid-template-columns:1fr 1fr 1fr;gap:8px}

  .cita{grid-template-columns:62px 1fr}
  .cita .acts{grid-column:1/-1;justify-content:flex-start}

  .hrow{grid-template-columns:70px 24px repeat(2,minmax(0,1fr))}
  .hrow .h2{grid-column:3/5}
  .tbl .hide-m{display:none}
}

.svc .ck{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:transparent;margin-right:12px;transition:all .2s}

<body>
<div class="blobs"><i></i><i></i><i></i></div>

<script>
/* =====================================================

   ===================================================== */
const API = 'https://script.google.com/macros/s/AKfycbwii6O9DPtI6DBWIuIhUygm1s70hVIQYZfOyLBWibyROM2WuSZ_etCUxvJHkIx0V07Q-A/exec';
const APP = 'Citas Pro';

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const eur = n => (+n).toLocaleString('es-ES', { minimumFractionDigits: (+n % 1 ? 2 : 0), maximumFractionDigits: 2 }) + ' €';
const IC = {
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  scissors: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  set: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  pin: '<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  chat: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/>',
  dl: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  spark: '<path d="m12 3 1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  edit: '<path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>'
};
const ic = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24">${IC[n] || ''}</svg>`;

function toast(m, err) {
  const d = document.createElement('div');
  d.className = 'toast' + (err ? ' err' : '');
  d.textContent = m;
  $('#toasts').appendChild(d);
  setTimeout(() => { d.style.transition = '.3s'; d.style.opacity = 0; setTimeout(() => d.remove(), 320); }, err ? 4200 : 2600);
}
function modal(html, opts = {}) {
  closeModal();
  const m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = `<div class="modal" role="dialog">${html}</div>`;
  m.addEventListener('mousedown', e => { if (e.target === m && !opts.fixed) closeModal(); });
  document.body.appendChild(m);
  return m.firstElementChild;
}
/* confirma({ titulo, texto, ok, no, peligro }) -> Promise<boolean> — sustituye a confirm() */
function confirma(o) {
  if (typeof o === 'string') o = { titulo: o };
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'cfm' + (o.peligro ? ' danger' : '');
    const icon = o.peligro ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
    w.innerHTML = `<div class="box" role="alertdialog" aria-modal="true"><div class="ico">${icon}</div><h3>${esc(o.titulo || '¿Seguro?')}</h3>${o.texto ? `<p>${esc(o.texto)}</p>` : '<p></p>'}
      <div class="bt"><button class="btn" data-r="0">${esc(o.no || 'Volver')}</button><button class="btn pri" data-r="1">${esc(o.ok || 'Aceptar')}</button></div></div>`;
    const fin = v => { document.removeEventListener('keydown', kd); w.classList.add('out'); setTimeout(() => w.remove(), 200); res(v); };
    const kd = e => { if (e.key === 'Escape') fin(false); if (e.key === 'Enter') fin(true); };
    w.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) fin(b.dataset.r === '1'); else if (e.target === w) fin(false); });
    document.addEventListener('keydown', kd);
    document.body.appendChild(w); setTimeout(() => w.querySelector('[data-r="1"]').focus(), 50);
  });
}
/* selector de imagen que sube a Drive (logo / portada) */
function imgPick(tipo, url) {
  const ph = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>';
  return `<div class="ipk" data-t="${tipo}" tabindex="0"><input type="hidden" id="${tipo === 'logo' ? 'aL' : 'aP'}" value="${esc(url || '')}"><input type="file" accept="image/png,image/jpeg,image/webp">
    <div class="pv" ${url ? `style="background-image:url('${esc(url)}')"` : ''}>${url ? '' : ph}</div>
    <div class="tx"><b>${url ? 'Cambiar imagen' : 'Elegir imagen'}</b><span class="mut">${tipo === 'logo' ? 'Recomendado <b style="display:inline;font-size:inherit">512 × 512 px</b> (cuadrado) · JPG o PNG' : 'Recomendado <b style="display:inline;font-size:inherit">1200 × 530 px</b> (horizontal) · JPG o PNG'}</span></div>
    ${url ? `<button type="button" class="x" title="Quitar">${ic('x')}</button>` : ''}</div>`;
}
function bindImgPick() {
  $$('.ipk').forEach(box => {
    const tipo = box.dataset.t, fi = box.querySelector('input[type=file]');
    box.onclick = e => { if (e.target.closest('.x') || box.classList.contains('up')) return; fi.click(); };
    box.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); } };
    box.ondragover = e => { e.preventDefault(); box.classList.add('drag'); };
    box.ondragleave = () => box.classList.remove('drag');
    box.ondrop = e => { e.preventDefault(); box.classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) subeImg(box, tipo, f); };
    fi.onchange = () => { const f = fi.files[0]; fi.value = ''; if (f) subeImg(box, tipo, f); };
    const x = box.querySelector('.x');
    if (x) x.onclick = async e => {
      e.stopPropagation();
      if (!await confirma({ titulo: tipo === 'logo' ? '¿Quitar el logo?' : '¿Quitar la portada?', texto: 'La imagen dejará de verse en tu web de reservas.', ok: 'Quitar', peligro: 1 })) return;
      box.classList.add('up');
      try { const d = await call('quitarImagen', { tipo }); P.yo.negocio = d.negocio; repinta(box, tipo, ''); toast('Imagen quitada'); }
      catch (err) { box.classList.remove('up'); toast(err.message, 1); }
    };
  });
}
function repinta(box, tipo, url) { if (tipo === 'logo') { const av = $('.biz .av'); if (av) { av.style.backgroundImage = url ? `url('${url}')` : ''; av.textContent = url ? '' : initial(P.yo.negocio.nombre); } } const w = document.createElement('div'); w.innerHTML = imgPick(tipo, url); box.replaceWith(w.firstElementChild); bindImgPick(); }
function reduceImg(file, max, tipo) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(u);
      const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      const mime = tipo === 'logo' && file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      const durl = c.toDataURL(mime, .86);
      res({ mime, datos: durl.split(',')[1], preview: durl });
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('No se pudo leer la imagen')); };
    img.src = u;
  });
}
async function subeImg(box, tipo, file) {
  if (!/^image\//.test(file.type)) return toast('Elige un archivo de imagen', 1);
  box.classList.add('up');
  try {
    const r = await reduceImg(file, tipo === 'logo' ? 512 : 1600, tipo);
    box.querySelector('.pv').style.backgroundImage = `url('${r.preview}')`;
    const d = await call('subirImagen', { tipo, mime: r.mime, datos: r.datos });
    P.yo.negocio = d.negocio; repinta(box, tipo, d.url);
    toast(tipo === 'logo' ? 'Logo subido' : 'Portada subida');
  } catch (e) { box.classList.remove('up'); toast(e.message, 1); }
}
function closeModal() { $$('.mask').forEach(m => { if (m._cleanup) m._cleanup(); m.remove(); }); }

const S = { token: localStorage.getItem('ci_t') || '' };
const NO_RETRY = ['reservar', 'registro', 'servGuardar', 'profGuardar', 'citaManual', 'adminDias'];
async function call(action, data = {}) {
  if (API.startsWith('PEGA')) throw new Error('Falta pegar la URL del servidor en index.html (constante API).');
  const body = JSON.stringify({ action, token: S.token, rid: Math.random().toString(36).slice(2), ...data });
  let tries = 0;
  for (;;) {
    try {
      const ac = new AbortController(), to = setTimeout(() => ac.abort(), 25000);
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, signal: ac.signal }).finally(() => clearTimeout(to));
      const j = await r.json();
      if (!j.ok) {
        const e = new Error(j.error || 'Error'); e.srv = true;
        if (/Sesión caducada/.test(e.message) && S.token) { S.token = ''; localStorage.removeItem('ci_t'); setTimeout(() => route(), 50); }
        throw e;
      }
      return j;

  const m = modal(`<h2 class="disp">Llave NFC</h2><p class="mut">Acerca tu llave al móvil o escanea el código con otro móvil.</p><div id="lk" class="center" style="min-height:220px"><span class="spin"></span></div><button class="btn block" data-a="cerrar">Cancelar</button>`);
  m.parentElement._cleanup = () => { activo = false; };
  try {
    const s = await call('llaveSesion');
    $('#lk').innerHTML = `<div><div class="qrbox" id="lkqr"></div><p><a class="btn pri" href="${esc(s.url)}" target="_blank" rel="noopener">${ic('key')} Usar en este dispositivo</a></p></div>`;
    if (window.QRCode) new QRCode($('#lkqr'), { text: s.url, width: 180, height: 180 });
    while (activo) {
      await sleep(1500);
      const r = await call('llaveEstado', { codigo: s.codigo });
      if (r.estado === 'ok') { S.token = r.token; localStorage.setItem('ci_t', r.token); closeModal(); return route(); }
      if (r.estado === 'denegado') { toast(r.motivo || 'Llave no autorizada', 1); closeModal(); return; }
      if (r.estado === 'caducado') { toast('La llave ha caducado, inténtalo de nuevo', 1); closeModal(); return; }
    }
  } catch (e) { if (activo) { $('#lk') && ($('#lk').innerHTML = `<p class="mut">${esc(e.message)}</p>`); } }
}

  const p = P.yo.profesionales.find(x => x.id === t.dataset.id) || { nombre: '', servicios: [], horario: { 1: [['09:00', '14:00'], ['16:00', '20:00']], 2: [['09:00', '14:00'], ['16:00', '20:00']], 3: [['09:00', '14:00'], ['16:00', '20:00']], 4: [['09:00', '14:00'], ['16:00', '20:00']], 5: [['09:00', '14:00'], ['16:00', '20:00']], 6: [['10:00', '14:00']], 0: [] } };
  const sel = new Set(p.servicios);
  modal(`<h2 class="disp">${p.id ? 'Editar' : 'Nuevo'} profesional</h2>
   <label class="f">Nombre</label><input class="inp" id="pN" value="${esc(p.nombre)}" placeholder="Nombre">
   <label class="f">Servicios que realiza <span class="mut">(ninguno marcado = todos)</span></label>
   <div class="row" id="pS" style="gap:8px">${P.yo.servicios.filter(s => s.activo).map(s => `<button type="button" class="chip ${sel.has(s.id) ? 'on' : ''}" data-a="chipS" data-id="${esc(s.id)}">${esc(s.nombre)}</button>`).join('')}</div>
   <label class="f">Horario semanal</label>
   ${DIAS.map(([d, n]) => { const h = p.horario[d] || [], a = h[0] || ['', ''], b = h[1] || ['', '']; return `<div class="hrow" data-d="${d}"><span class="small"><b>${n}</b></span><input type="checkbox" class="sw" ${h.length ? 'checked' : ''}><input class="inp" type="time" value="${a[0]}"><input class="inp" type="time" value="${a[1]}"><input class="inp h2" type="time" value="${b[0]}"><input class="inp h2" type="time" value="${b[1]}"></div>`; }).join('')}
   <p class="mut small">Cada día admite dos franjas (por ejemplo, mañana y tarde).</p>
   <div class="row" style="margin-top:14px"><button class="btn grow" data-a="cerrar">Cancelar</button><button class="btn pri grow" id="pOk">Guardar</button></div>`);
  $('#pOk').onclick = async () => {
    const b = $('#pOk'), hor = {};
    $$('.hrow').forEach(r => { const i = $$('input', r), on = i[0].checked, fr = []; if (on) { if (i[1].value && i[2].value) fr.push([i[1].value, i[2].value]); if (i[3].value && i[4].value) fr.push([i[3].value, i[4].value]); } hor[r.dataset.d] = fr; });
    loading(b, true);
    try { const d = await call('profGuardar', { datos: { id: p.id, nombre: $('#pN').value, servicios: $$('#pS .chip.on').map(c => c.dataset.id), horario: hor } }); P.yo.profesionales = d.profesionales; closeModal(); toast('Profesional guardado'); pEquipo(); }
    catch (e) { toast(e.message, 1); loading(b, false); }
  };
};
H.chipS = t => t.classList.toggle('on');
H.profDel = async t => { if (!await confirma({ titulo: '¿Quitar a este profesional?', texto: 'Ya no se podrán reservar citas con él. Sus citas anteriores se conservan.', ok: 'Quitar', peligro: 1 })) return; try { P.yo.profesionales = (await call('profBorrar', { id: t.dataset.id })).profesionales; pEquipo(); } catch (e) { toast(e.message, 1); } };

/* --- Ajustes --- */
const PRESETS = ['#c026d3', '#e11d48', '#f97316', '#d4a017', '#16a34a', '#0d9488', '#2563eb', '#7c3aed', '#111827'];
function pAjustes() {
  const n = P.yo.negocio;
  pm(`<div class="ptitle"><h1 class="disp">Ajustes</h1></div>
   <div class="card pad rv"><h3 class="disp">Tu marca</h3>
    <label class="f">Nombre del negocio</label><input class="inp" id="aN" value="${esc(n.nombre)}">
    <label class="f">Color de tu marca</label>
    <div class="row"><input type="color" id="aC" value="${esc(n.color)}" style="width:52px;height:42px;border:0;background:none;padding:0;cursor:pointer"><div class="swatches">${PRESETS.map(c => `<i style="background:${c}" data-a="pre" data-c="${c}" class="${c === n.color ? 'on' : ''}"></i>`).join('')}</div></div>
    <div class="two"><div><label class="f">Logo</label>${imgPick('logo', n.logo)}</div><div><label class="f">Imagen de portada</label>${imgPick('portada', n.portada)}</div></div>
    <label class="f">Descripción</label><textarea class="inp" id="aD" placeholder="Cuéntales qué os hace especiales">${esc(n.descripcion)}</textarea></div>
   <div class="card pad rv" style="margin-top:14px"><h3 class="disp">Contacto</h3>
    <div class="two"><div><label class="f">Teléfono</label><input class="inp" id="aT" type="tel" value="${esc(n.telefono)}"></div><div><label class="f">WhatsApp (con prefijo)</label><input class="inp" id="aW" type="tel" value="${esc(n.whatsapp)}" placeholder="34600123456"></div></div>
    <label class="f">Dirección</label><input class="inp" id="aDir" value="${esc(n.direccion)}"></div>
   <div class="card pad rv" style="margin-top:14px"><h3 class="disp">Reservas</h3>
    <label class="f">Tu enlace de reservas</label><div class="row" style="flex-wrap:nowrap"><span class="mut small" style="white-space:nowrap">…?n=</span><input class="inp" id="aS" value="${esc(n.slug)}"></div>
    <div class="two"><div><label class="f">Intervalo entre huecos</label><select class="inp" id="aPa">${[10, 15, 20, 30, 45, 60].map(v => `<option value="${v}" ${v === n.paso ? 'selected' : ''}>${v} minutos</option>`).join('')}</select></div>
    <div><label class="f">Antelación mínima para reservar</label><select class="inp" id="aA">${[[0, 'Sin antelación'], [30, '30 minutos'], [60, '1 hora'], [120, '2 horas'], [240, '4 horas'], [1440, '1 día']].map(v => `<option value="${v[0]}" ${v[0] === n.antelacion ? 'selected' : ''}>${v[1]}</option>`).join('')}</select></div></div></div>
   <div class="row" style="margin-top:16px"><button class="btn pri" id="aOk">${ic('check')} Guardar cambios</button></div>
   <div class="card pad rv" style="margin-top:22px"><h3 class="disp">Sesión</h3>
    <div class="row" style="margin-top:10px">${isStandalone() ? '' : `<button class="btn" data-a="instalar">${ic('dl')} Instalar app</button>`}<button class="btn" data-a="salir">${ic('out')} Cerrar sesión</button></div></div>
   <div class="card pad rv" style="margin-top:14px"><h3 class="disp">Cambiar contraseña</h3>
    <div class="two"><div><label class="f">Contraseña actual</label><input class="inp" id="cA" type="password" autocomplete="current-password"></div><div><label class="f">Nueva contraseña</label><input class="inp" id="cN" type="password" autocomplete="new-password"></div></div>
    <button class="btn" id="cOk" style="margin-top:14px">Cambiar contraseña</button></div>`);
  $('#aC').oninput = e => setBrand(e.target.value);
  bindImgPick();
  $('#aOk').onclick = async () => {
    const b = $('#aOk'); loading(b, true);
    try {
      const d = await call('guardarNegocio', { datos: { nombre: $('#aN').value, color: $('#aC').value, logo: $('#aL').value, portada: $('#aP').value, descripcion: $('#aD').value, telefono: $('#aT').value, whatsapp: $('#aW').value, direccion: $('#aDir').value, slug: $('#aS').value, paso: $('#aPa').value, antelacion: $('#aA').value } });
      P.yo.negocio = d.negocio; toast('Cambios guardados'); panelInit({ ...P.yo }); P.tab = 'ajustes'; pTab('ajustes');
    } catch (e) { toast(e.message, 1); loading(b, false); }
  };
  $('#cOk').onclick = async () => {
    const b = $('#cOk'); if ($('#cN').value.length < 8) return toast('La nueva contraseña necesita 8 caracteres', 1);
    loading(b, true);
    try { const em = P.yo.email; await call('cambiarPass', { clave: await hashClave(em, $('#cA').value), nueva: await hashClave(em, $('#cN').value) }); toast('Contraseña cambiada'); $('#cA').value = $('#cN').value = ''; }
    catch (e) { toast(e.message, 1); } loading(b, false, 'Cambiar contraseña');
  };
}
H.pre = t => { $('#aC').value = t.dataset.c; setBrand(t.dataset.c); $$('.swatches i').forEach(i => i.classList.toggle('on', i === t)); };

/* --- Enlace --- */
function urlReserva() { return urlRes(P.yo.negocio.slug); }
function pEnlace() {
  const u = urlReserva(), n = P.yo.negocio;
  pm(`<div class="ptitle"><h1 class="disp">Tu enlace de reservas</h1></div>
   <div class="card pad rv" style="text-align:center"><p class="mut">Ponlo en tu Instagram, WhatsApp, Google y en la puerta del local.</p>
    <div class="qrbox" id="qr" style="margin:10px 0 18px"></div>

H.cmp = () => compartir({ title: P.yo.negocio.nombre, text: 'Reserva tu cita en ' + P.yo.negocio.nombre + ':', url: urlReserva() });
H.qrdl = () => { const c = $('#qr canvas'); if (!c) return; const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = 'qr-reservas.png'; a.click(); };

/* --- Plan --- */
function pPlan() {
  const y = P.yo, dias = Math.max(0, Math.round((parseF(y.venceEn) - parseF(y.hoy)) / 864e5));
  const planes = y.pago.planes || [{ meses: 1, dias: 30, precio: y.pago.precio }];
  const base = planes[0].precio / planes[0].meses;
  P.plan = P.plan == null ? Math.min(1, planes.length - 1) : P.plan;
  const esc2 = dias > 180 ? 365 : dias > 90 ? 180 : dias > 30 ? 90 : 30, pc = Math.min(1, dias / esc2), C = 2 * Math.PI * 62;
  const nom = m => m === 12 ? '1 año' : m === 1 ? '1 mes' : m + ' meses';
  const card = (pl, i) => {
    const ahorro = Math.round(base * pl.meses - pl.precio), pm2 = pl.precio / pl.meses;
    return `<button class="plan ${P.plan === i ? 'on' : ''}" data-a="plan" data-i="${i}">
      ${ahorro > 0 ? `<span class="tag">Ahorras ${eur(ahorro)}</span>` : ''}${i === planes.length - 1 ? '<span class="tag top">Mejor precio</span>' : ''}
      <b class="pn">${nom(pl.meses)}</b><span class="pp">${eur(pl.precio)}</span><span class="mut small">${eur(Math.round(pm2 * 100) / 100)} / mes</span></button>`;
  };
  const sel = planes[P.plan], precio = String(sel.precio).replace('.', ',');
  pm(`<div class="ptitle"><h1 class="disp">Tu plan</h1></div>
   <div class="card pad rv" style="text-align:center;max-width:640px">
    <div class="ring"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="75" cy="75" r="62" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pc)}" style="transition:stroke-dashoffset 1.2s"/><defs><linearGradient id="g"><stop offset="0" stop-color="var(--brand)"/><stop offset="1" stop-color="var(--b2)"/></linearGradient></defs></svg><div class="n"><div>${dias}<small>días restantes</small></div></div></div>
    <p class="mut">${dias > 0 ? 'Tu plan está activo hasta el <b>' + esc(fLarga(y.venceEn)) + '</b>.' : 'Tu plan ha vencido: tus clientes no pueden reservar hasta que lo renueves.'}</p>
    <h3 class="disp" style="margin:18px 0 12px">Elige cuánto tiempo renovar</h3>
    <div class="plans">${planes.map(card).join('')}</div>
    <a class="btn pri block" style="margin-top:18px" target="_blank" rel="noopener" href="${esc(y.pago.tag)}/${precio}">${ic('card')} Pagar ${eur(sel.precio)} · ${nom(sel.meses)}</a>
    <p class="mut small" style="margin-top:12px">Si renuevas con días pendientes, se suman. Tras el pago, tus ${sel.dias} días se añaden en cuanto lo confirmemos.</p></div>`);
}
H.plan = t => { P.plan = +t.dataset.i; pPlan(); };

/* =====================================================
   PANEL ADMIN
   ===================================================== */
let A = null;
async function adminInit(d) {
  waFab(false);
  A = { d };
  setBrand('#2563eb'); document.title = APP + ' · Administración';
  $('#root').innerHTML = `<div class="main" style="max-width:1100px;margin:0 auto"><div class="ptitle"><h1 class="disp">Administración</h1><div class="row"><button class="btn sm" data-a="adm2fa">${ic('shield')} Authenticator</button><button class="btn sm" data-a="salir">${ic('out')} Salir</button></div></div><div id="adm"><div class="skel" style="height:300px"></div></div></div>`;
  adminLista();
}
async function adminLista() {
  try {
    const { negocios } = await call('adminNegocios'); A.neg = negocios;
    const act = negocios.filter(n => n.activo).length;
    $('#adm').innerHTML = `<div class="stats"><div class="card stat"><b id="a1">0</b><span>Negocios</span></div><div class="card stat"><b id="a2">0</b><span>Con plan activo</span></div><div class="card stat"><b id="a3">0</b><span>Citas totales</span></div></div>
     <div class="card pad" style="overflow:auto"><table class="tbl"><thead><tr><th>Negocio</th><th class="hide-m">Correo</th><th>Vence</th><th class="hide-m">Citas</th><th></th></tr></thead><tbody>
     ${negocios.map(n => `<tr><td><b>${esc(n.nombre)}</b><br><a class="small mut" target="_blank" rel="noopener" href="${ROOT}reservar/?n=${esc(n.slug)}">?n=${esc(n.slug)}</a></td><td class="hide-m">${esc(n.email)}</td><td><span class="badge ${n.estado === 'bloqueado' ? 'bad' : n.activo ? 'ok' : 'warn'}">${n.estado === 'bloqueado' ? 'Suspendido' : esc(n.venceEn)}</span></td><td class="hide-m">${n.citas}</td>
     <td><div class="row" style="gap:6px;flex-wrap:nowrap">${[[30, '+1 m'], [90, '+3 m'], [180, '+6 m'], [365, '+1 a']].map(x => `<button class="btn sm" data-a="adDias" data-id="${esc(n.id)}" data-d="${x[0]}" title="Añadir ${x[0]} días">${x[1]}</button>`).join('')}<button class="btn sm" data-a="adCustom" data-id="${esc(n.id)}">±</button><button class="btn sm ${n.estado === 'bloqueado' ? '' : 'danger'}" data-a="adEst" data-id="${esc(n.id)}" data-e="${n.estado === 'bloqueado' ? 'activo' : 'bloqueado'}">${n.estado === 'bloqueado' ? 'Activar' : 'Suspender'}</button></div></td></tr>`).join('') || '<tr><td colspan="5" class="mut">Aún no hay negocios registrados.</td></tr>'}
     </tbody></table></div>`;
    countUp($('#a1'), negocios.length); countUp($('#a2'), act); countUp($('#a3'), negocios.reduce((a, n) => a + n.citas, 0));
  } catch (e) { toast(e.message, 1); }
}
H.adDias = async t => { try { const r = await call('adminDias', { id: t.dataset.id, dias: +t.dataset.d }); toast('Vence el ' + r.venceEn); adminLista(); } catch (e) { toast(e.message, 1); } };
H.adCustom = t => {
  modal(`<h2 class="disp">Sumar o restar días</h2><label class="f">Días (negativo para restar)</label><input class="inp" id="adn" type="number" value="30"><div class="row" style="margin-top:16px"><button class="btn grow" data-a="cerrar">Cancelar</button><button class="btn pri grow" id="adok">Aplicar</button></div>`);
  $('#adok').onclick = async () => { try { const r = await call('adminDias', { id: t.dataset.id, dias: +$('#adn').value }); closeModal(); toast('Vence el ' + r.venceEn); adminLista(); } catch (e) { toast(e.message, 1); } };
};
H.adEst = async t => { try { await call('adminEstado', { id: t.dataset.id, estado: t.dataset.e }); adminLista(); } catch (e) { toast(e.message, 1); } };
H.adm2fa = async () => {
  const m = modal('<div class="center" style="min-height:200px"><span class="spin"></span></div>');
  try { const s = await call('totpStatus'); totpBox(s.activo); } catch (e) { closeModal(); toast(e.message, 1); }
};
function totpBox(activo) {
  modal(`<h2 class="disp">Google Authenticator</h2>
   <p class="mut">${activo ? 'Activo. Para entrar como administrador deja el correo vacío y escribe el código de 6 cifras en la contraseña.' : 'Actívalo para entrar sin correo ni contraseña, solo con el código de tu móvil.'}</p>
   <div class="row" style="margin-top:14px"><button class="btn pri" data-a="totpIni">${activo ? 'Vincular otro móvil' : 'Configurar'}</button>${activo ? '<button class="btn danger" data-a="totpOff">Desactivar</button>' : ''}<button class="btn" data-a="cerrar">Cerrar</button></div>`);
}
H.totpIni = async () => {
  try {
    const d = await call('totpStart');
    modal(`<h2 class="disp">Escanea el código</h2><p class="mut small">Abre Google Authenticator → + → Escanear código QR.</p>
     <div style="text-align:center"><div class="qrbox" id="tq"></div><p class="small mut" style="word-break:break-all">Clave manual: <b>${esc(d.secret)}</b></p></div>
     <label class="f">Código de 6 cifras para confirmar</label><input class="inp" id="tcd" inputmode="numeric" maxlength="6">
     <div class="row" style="margin-top:16px"><button class="btn grow" data-a="cerrar">Cancelar</button><button class="btn pri grow" id="tok">Activar</button></div>`);
    if (window.QRCode) new QRCode($('#tq'), { text: d.uri, width: 190, height: 190 });
    $('#tok').onclick = async () => { try { await call('totpConfirm', { code: $('#tcd').value.trim() }); closeModal(); toast('Authenticator activado'); } catch (e) { toast(e.message, 1); } };
  } catch (e) { toast(e.message, 1); }
};
H.totpOff = async () => { if (!await confirma({ titulo: '¿Desactivar Authenticator?', texto: 'Ya no podrás entrar con el código de 6 cifras hasta que lo vuelvas a configurar.', ok: 'Desactivar', peligro: 1 })) return; try { await call('totpDisable'); closeModal(); toast('Desactivado'); } catch (e) { toast(e.message, 1); } };

/* ---------- arranque ---------- */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
route();
</script>
